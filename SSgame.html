<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Says Game</title>

    <link rel="stylesheet" href="SSgame.css">
</head>

<body>

    <div class="game-container">

        <h1>Simon Says</h1>

        <p id="message">Press Start to play</p>

        <div class="score">
            Level: <span id="level">0</span>
        </div>

        <div class="game-board">

            <button class="color red" id="red"></button>

            <button class="color green" id="green"></button>

            <button class="color blue" id="blue"></button>

            <button class="color yellow" id="yellow"></button>

        </div>

        <button id="start-btn">Start Game</button>

    </div>

    <script src="SSgame.js"></script>

</body>
</html>
